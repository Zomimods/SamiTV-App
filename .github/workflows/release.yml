name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAMI_KEYSTORE_BASE64: ${{ secrets.SAMI_KEYSTORE_BASE64 }}
      SAMI_KEYSTORE_PASSWORD: ${{ secrets.SAMI_KEYSTORE_PASSWORD }}
      SAMI_KEY_ALIAS: ${{ secrets.SAMI_KEY_ALIAS }}
      SAMI_KEY_PASSWORD: ${{ secrets.SAMI_KEY_PASSWORD }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        run: |
          missing=""
          for v in SAMI_KEYSTORE_BASE64 SAMI_KEYSTORE_PASSWORD SAMI_KEY_ALIAS SAMI_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (see RELEASE.md)"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore and optional Firebase config
        run: |
          echo "$SAMI_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SAMI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
          fi

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-manual" >> "$GITHUB_OUTPUT"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Build signed release APK
        run: >
          ./gradlew --no-daemon :app:assembleRelease
          -PsamiVersionCode=${{ github.run_number }}
          -PsamiVersionName=${{ steps.version.outputs.name }}

      - name: Verify APK signature
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          case "$apk" in *unsigned*) echo "::error::APK is unsigned"; exit 1;; esac
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$apksigner" verify --print-certs "$apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: sami-live-tv-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk \
            --title "SAMI Live TV $GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --clobber

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
